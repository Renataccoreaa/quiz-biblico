{% extends "base.html" %}
{% block conteudo %}
<h1>📖 Quiz Bíblico</h1>
<p class="subtitulo">Escolha um livro da Bíblia para começar!</p>

<form action="{{ url_for('comecar') }}" method="POST" class="lista-livros">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {% for livro in livros %}
        <button type="submit" name="livro" value="{{ livro }}" class="botao-livro">{{ livro }}</button>
    {% endfor %}
</form>
{% endblock %}
