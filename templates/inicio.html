<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Quiz Bíblico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📖 Quiz Bíblico</h1>
        <p>Escolha um livro da Bíblia para começar o quiz!</p>

        <!--
            Este formulário envia (via POST) o livro escolhido para a rota /comecar.
            Cada botão é, na verdade, um botão de "submit" diferente — usamos
            o atributo "name=livro" e "value" para indicar qual livro foi escolhido.
        -->
        <form action="/comecar" method="POST" class="lista-livros">
            {% for livro in livros %}
                <button type="submit" name="livro" value="{{ livro }}" class="botao-livro">
                    {{ livro }}
                </button>
            {% endfor %}
        </form>
    </div>
</body>
</html>
